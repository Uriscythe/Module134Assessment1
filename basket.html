      </div>

          <h2>Macbook</h2>

      <button onclick="clearBag()">Clear Bag</button>
      <h2>Total Basket Price</h2>
      <!--Contains a total price for any given type of product-->
      <ul id="shoppingCart"></ul>
      <!--creates a form to accept order-->
      <form id = "buyNow">
      <!--Creates a form to display grand total of all products-->
      <button id="totalShoppingCart" onclick="deleteItems()" class="btn btn-primary"></button>
      </form>
      <script>
      //Deltes items from page so new orders can be made
      function deleteItems() {
        //Clears it from local storage aswell as screen
        localStorage.clear();
        //Send users alert order is placed
        alert("ORDER CONFIRMED!");
        }
      function clearBag(){
        localStorage.clear();
      }
    </script>
</body>

        <img class="chat" src="Chat.png" id="iconChat">

</footer>
<script>

  var icon = document.getElementById("icon");

  var dotheme = (theme) => {
    document.body.setAttribute("data-theme", theme)
    if (theme=="light") {
      icon.src="moon.png"
      iconChat.src="Chat.png"
      iconBasket.src="Basket.svg"
    }else{
      icon.src="sun.png"
      iconChat.src="ChatLight.png"
      iconBasket.src="BasketLight.png"
    }
  }

  icon.addEventListener('click', () => {
    var theme = document.body.getAttribute("data-theme");
    if (theme == "dark") {
      dotheme("light");
    }else {
      dotheme("dark");
    }
  })


</script>
